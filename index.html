<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel Financeiro - Oficial</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Compat SDK (Para arquivos únicos) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'

    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .dark * { scrollbar-color: #475569 transparent; }
        
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-content { overflow-x: hidden; }
        .chat-bubble-left { border-radius: 16px 16px 16px 4px; }
        .chat-bubble-right { border-radius: 16px 16px 4px 16px; }

</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-800 dark:text-slate-200 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        // INICIALIZAÇÃO FIREBASE OFICIAL
        const firebaseConfig = {
            apiKey: "AIzaSyDEWTa9C1qR37YxUioL6dXaJ7KlFPgvCbc",
            authDomain: "meu-painel-financeiro-ap-7bd64.firebaseapp.com",
            databaseURL: "https://meu-painel-financeiro-ap-7bd64-default-rtdb.firebaseio.com",
            projectId: "meu-painel-financeiro-ap-7bd64",
            storageBucket: "meu-painel-financeiro-ap-7bd64.firebasestorage.app",
            messagingSenderId: "557887881327",
            appId: "1:557887881327:web:afb7aaaec979cf1ef44d9a"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, Tooltip: RechartsTooltip, ResponsiveContainer } = window.Recharts;

        // --- Componentes Genéricos ---
        function DialogModal({ isOpen, title, message, onConfirm, onCancel, confirmText = 'Confirmar', cancelText = 'Cancelar', isDestructive = false }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-darkcard w-full max-w-sm rounded-2xl p-6 border border-darkborder shadow-2xl">
                        <h3 className="text-xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-slate-400 text-sm mb-6">{message}</p>
                        <div className="flex justify-end space-x-3">
                            <button onClick={onCancel} className="px-4 py-2 text-sm font-bold text-slate-300 hover:bg-slate-800 rounded-lg transition-colors">{cancelText}</button>
                            <button onClick={onConfirm} className={`px-4 py-2 text-sm font-bold text-white rounded-lg transition-colors ${isDestructive ? 'bg-rose-600 hover:bg-rose-500' : 'bg-indigo-600 hover:bg-indigo-500'}`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AlertModal({ isOpen, title, message, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-darkcard w-full max-w-sm rounded-2xl p-6 border border-darkborder shadow-2xl">
                        <h3 className="text-xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-slate-400 text-sm mb-6">{message}</p>
                        <button onClick={onClose} className="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition-colors">Entendi</button>
                    </div>
                </div>
            );
        }

        // --- Tela de Login Real ---
        function LoginScreen() {
            const [isRegister, setIsRegister] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            const [email, setEmail] = useState('');
            const [name, setName] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [isLoadingAction, setIsLoadingAction] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setIsLoadingAction(true);
                
                try {
                    if (isRegister) {
                        if (password !== confirmPassword) {
                            setError('As senhas não coincidem!');
                            setIsLoadingAction(false);
                            return;
                        }
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        const user = cred.user;
                        
                        // Provisionamento Padrão de Fábrica no Firebase
                        await db.collection('users').doc(user.uid).set({ name, email });
                        
                        await db.collection('accounts').add({ userId: user.uid, name: 'Carteira', type: 'wallet', initialBalance: 0 });
                        
                        await db.collection('spaces').add({
                            creatorId: user.uid, creatorEmail: email, name: 'Pessoal', isIndividual: true, color: '#3b82f6', icon: '👤', participantEmails: [email], membersData: [{email, status: 'accepted'}]
                        });
                        
                        const defaultCats = [
                            { name: 'Moradia', color: '#6366f1', icon: '🏠' },
                            { name: 'Alimentação', color: '#f59e0b', icon: '🍔' },
                            { name: 'Transporte', color: '#10b981', icon: '🚗' },
                            { name: 'Saúde', color: '#ef4444', icon: '⚕️' },
                            { name: 'Lazer', color: '#ec4899', icon: '🎉' },
                            { name: 'Outros', color: '#8b5cf6', icon: '📦' }
                        ];
                        for (const cat of defaultCats) {
                            await db.collection('categories').add({ userId: user.uid, ...cat });
                        }
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message.includes('auth/') ? 'E-mail ou senha inválidos, verifique e tente novamente.' : err.message);
                    setIsLoadingAction(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 px-4 relative overflow-hidden w-full dark">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40"></div>
                    
                    <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700 z-10 animate-fade-in">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4">
                                <i className="ph-fill ph-wallet"></i>
                            </div>
                            <h1 className="text-2xl font-bold text-white mb-2">{isRegister ? 'Criar Nova Conta' : 'Acesse seu Painel'}</h1>
                            <p className="text-slate-400 text-sm">Controle financeiro inteligente e colaborativo</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {error && <div className="p-3 bg-rose-500/20 border border-rose-500/50 rounded-lg text-rose-400 text-sm text-center font-bold">{error}</div>}
                            
                            {isRegister && (
                                <div className="animate-fade-in">
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Nome</label>
                                    <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Seu nome" />
                                </div>
                            )}

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">E-mail</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="seu@email.com" />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Senha</label>
                                <div className="relative">
                                    <input type={showPassword ? "text" : "password"} required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••" />
                                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3 text-slate-400 hover:text-white">
                                        <i className={`ph ${showPassword ? 'ph-eye-slash' : 'ph-eye'} text-xl`}></i>
                                    </button>
                                </div>
                            </div>

                            {isRegister && (
                                <div className="animate-fade-in">
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Confirmar Senha</label>
                                    <input type={showPassword ? "text" : "password"} required value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••" />
                                </div>
                            )}

                            <button type="submit" disabled={isLoadingAction} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-600 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-indigo-500/30 mt-6 flex justify-center items-center">
                                {isLoadingAction ? <i className="ph ph-spinner animate-spin text-xl"></i> : (isRegister ? 'Criar Minha Conta' : 'Entrar no Sistema')}
                            </button>
                        </form>

                        <div className="mt-6 text-center text-sm text-slate-400">
                            {isRegister ? 'Já tem uma conta?' : 'Ainda não tem conta?'}
                            <button onClick={() => { setIsRegister(!isRegister); setError(''); }} className="ml-2 text-indigo-400 font-bold hover:text-indigo-300">
                                {isRegister ? 'Fazer Login' : 'Cadastre-se grátis'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- APLICATIVO PRINCIPAL COM FIREBASE REAL ---
        function MainApp() {
            const [currentUser, setCurrentUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);
            
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const [isSidebarPinned, setIsSidebarPinned] = useState(false);
            const [isSidebarHovered, setIsSidebarHovered] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false); // NOVO ESTADO MOBILE
            const isSidebarExpanded = isSidebarPinned || isSidebarHovered || isMobileMenuOpen;
            
            // Dados (Recebidos do Firebase)
            const [accounts, setAccounts] = useState([]);
            const [spaces, setSpaces] = useState([]);
            const [categories, setCategories] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [inboxItems, setInboxItems] = useState([]);
            
            // Controle de Diálogos Customizados
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null, isDestructive: false });
            const [alertDialog, setAlertDialog] = useState({ isOpen: false, title: '', message: '' });

            const showConfirm = (title, message, onConfirm, isDestructive = false) => setConfirmDialog({ isOpen: true, title, message, onConfirm, isDestructive });
            const closeConfirm = () => setConfirmDialog(prev => ({ ...prev, isOpen: false }));
            
            const showAlert = (title, message) => setAlertDialog({ isOpen: true, title, message });
            const closeAlert = () => setAlertDialog(prev => ({ ...prev, isOpen: false }));

            // Modais de Formulário
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            
            const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);
            const [editingAccount, setEditingAccount] = useState(null);
            const [accountModalType, setAccountModalType] = useState('wallet');
            
            const [isSpaceModalOpen, setIsSpaceModalOpen] = useState(false);
            const [editingSpace, setEditingSpace] = useState(null);

            const [selectedAccountDetails, setSelectedAccountDetails] = useState(null);
            
            const [isChatModalOpen, setIsChatModalOpen] = useState(false);
            const [activeChatItem, setActiveChatItem] = useState(null);

            // Tempo
            const handlePrevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const monthYearString = currentDate.toLocaleString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();

            // Mudar aba e fechar menu mobile
            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setIsMobileMenuOpen(false);
            };

            // Firebase Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(user => {
                    setCurrentUser(user);
                    if (user) {
                        db.collection('users').doc(user.uid).get().then(doc => {
                            if(doc.exists) setUserProfile(doc.data());
                        });
                    }
                    setIsCheckingAuth(false);
                });
                return unsubscribe;
            }, []);

            // Firebase Real-time DB Listeners
            useEffect(() => {
                if (!currentUser) return;
                const uid = currentUser.uid;
                const email = currentUser.email;

                const unsubAccounts = db.collection('accounts').where('userId', '==', uid)
                    .onSnapshot(snap => setAccounts(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    
                const unsubCats = db.collection('categories').where('userId', '==', uid)
                    .onSnapshot(snap => setCategories(snap.docs.map(d => ({ id: d.id, ...d.data() }))));

                const unsubSpaces = db.collection('spaces').where('participantEmails', 'array-contains', email)
                    .onSnapshot(snap => setSpaces(snap.docs.map(d => ({ 
                        id: d.id, ...d.data(), isCreator: d.data().creatorEmail === email 
                    }))));

                const unsubTxs = db.collection('transactions').where('participantEmails', 'array-contains', email)
                    .onSnapshot(snap => setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                
                return () => { unsubAccounts(); unsubCats(); unsubSpaces(); unsubTxs(); };
            }, [currentUser]);

            // Derivar Inbox (Convites Pendentes de Espaços e Transações)
            useEffect(() => {
                if (!currentUser) return;
                const email = currentUser.email;
                const newInbox = [];

                spaces.forEach(space => {
                    if (!space.isCreator) {
                        const memberData = space.membersData?.find(m => m.email === email);
                        if (memberData && memberData.status === 'pending') {
                            newInbox.push({
                                id: `space_${space.id}`, realId: space.id, type: 'space_invite', from: space.creatorEmail,
                                spaceName: space.name, description: 'Convite para participar do espaço',
                                date: space.createdAt || new Date().toISOString().split('T')[0], status: 'pending', messages: []
                            });
                        }
                    }
                });

                transactions.forEach(tx => {
                    if (tx.creatorEmail !== email) {
                        const mySplit = tx.splitParticipants?.find(p => p.email === email || p.id === email);
                        if (mySplit && mySplit.status === 'pending') {
                            newInbox.push({
                                id: `tx_${tx.id}`, realId: tx.id, type: 'expense', from: tx.creatorEmail,
                                description: tx.description, totalAmount: parseFloat(tx.amount || 0),
                                userAmount: parseFloat(mySplit.amount || 0), date: tx.launchDate || new Date().toISOString().split('T')[0],
                                status: 'pending', messages: tx.messages || []
                            });
                        }
                    }
                });

                setInboxItems(newInbox);
            }, [spaces, transactions, currentUser]);

            // Filtros de Mês
            const filteredTransactions = useMemo(() => {
                const month = currentDate.getMonth();
                const year = currentDate.getFullYear();
                return transactions.filter(tx => {
                    const refDate = tx.dueDate || tx.launchDate;
                    if (!refDate) return false;
                    const txDate = new Date(refDate + 'T12:00:00');
                    return txDate.getMonth() === month && txDate.getFullYear() === year;
                }).sort((a, b) => new Date(a.dueDate || a.launchDate) - new Date(b.dueDate || b.launchDate));
            }, [transactions, currentDate]);

            // --- FUNÇÕES CRUD FIREBASE ---
            
            const saveTransaction = async (txData) => {
                let participantEmails = [currentUser.email];
                if (txData.splitType === 'space') {
                    const space = spaces.find(s => s.id === txData.spaceId);
                    if (space) participantEmails = [...space.participantEmails];
                } else if (txData.splitType === 'avulso') {
                    const avulsoEmails = txData.avulsoList.map(a => a.email).filter(Boolean);
                    participantEmails = [...participantEmails, ...avulsoEmails];
                }
                participantEmails = [...new Set(participantEmails)];
                
                if (txData.splitParticipants) {
                    txData.splitParticipants = txData.splitParticipants.map(p => ({
                        ...p, status: (p.id === 'me' || p.id === currentUser.email) ? 'accepted' : (p.status || 'pending')
                    }));
                }

                const data = {
                    ...txData, creatorId: currentUser.uid, creatorEmail: currentUser.email, participantEmails
                };

                if (txData.id) await db.collection('transactions').doc(txData.id).update(data);
                else await db.collection('transactions').add(data);
                
                setIsTransactionModalOpen(false);
                setEditingTx(null);
            };

            const deleteTransaction = (id) => {
                showConfirm('Excluir Lançamento', 'Tem certeza que deseja excluir esta transação? A ação não pode ser desfeita.', async () => {
                    await db.collection('transactions').doc(id).delete();
                    closeConfirm();
                }, true);
            };

            const toggleTransactionStatus = async (id) => {
                const tx = transactions.find(t => t.id === id);
                if(tx) await db.collection('transactions').doc(id).update({ status: tx.status === 'paid' ? 'pending' : 'paid' });
            };

            const saveAccount = async (accData) => {
                const data = { ...accData, userId: currentUser.uid };
                if (accData.id) await db.collection('accounts').doc(accData.id).update(data);
                else await db.collection('accounts').add(data);
                setIsAccountModalOpen(false);
            };

            const deleteAccount = (id) => {
                if(accounts.find(a => a.id === id)?.name === 'Carteira') {
                    showAlert('Ação Negada', 'A conta "Carteira" é padrão do sistema e não pode ser excluída.');
                    return;
                }
                showConfirm('Excluir Conta', 'Deseja excluir esta conta? Suas transações serão apagadas junto.', async () => {
                    await db.collection('accounts').doc(id).delete();
                    transactions.filter(t => t.accountId === id).forEach(tx => db.collection('transactions').doc(tx.id).delete());
                    closeConfirm();
                }, true);
            };

            const saveSpace = async (spaceData) => {
                let participantEmails = spaceData.isIndividual ? [currentUser.email] : [currentUser.email, ...spaceData.members];
                participantEmails = [...new Set(participantEmails)];
                
                const membersData = participantEmails.map(email => ({
                    email, status: email === currentUser.email ? 'accepted' : 'pending'
                }));

                const data = {
                    creatorId: currentUser.uid, creatorEmail: currentUser.email, name: spaceData.name,
                    isIndividual: spaceData.isIndividual, color: spaceData.color, icon: spaceData.icon,
                    participantEmails, membersData
                };

                if (spaceData.id) await db.collection('spaces').doc(spaceData.id).update(data);
                else { data.createdAt = new Date().toISOString().split('T')[0]; await db.collection('spaces').add(data); }
                setIsSpaceModalOpen(false);
            };

            const deleteSpace = (id) => {
                if(spaces.find(s => s.id === id)?.name === 'Pessoal') {
                    showAlert('Ação Negada', 'O espaço "Pessoal" é essencial e não pode ser excluído.');
                    return;
                }
                showConfirm('Excluir Espaço', 'Deseja excluir este espaço?', async () => {
                    await db.collection('spaces').doc(id).delete();
                    closeConfirm();
                }, true);
            };
            
            const leaveSpace = (id) => {
                const spaceToLeave = spaces.find(s => s.id === id);
                showConfirm('Sair do Espaço', `Deseja sair do espaço "${spaceToLeave?.name}"?`, async () => {
                    await db.collection('spaces').doc(id).update({
                        participantEmails: spaceToLeave.participantEmails.filter(e => e !== currentUser.email),
                        membersData: spaceToLeave.membersData.filter(m => m.email !== currentUser.email)
                    });
                    closeConfirm();
                    showAlert('Sucesso', 'Você saiu do espaço.');
                }, true);
            };

            const handleAcceptInbox = async (item) => {
                if(!item) return;
                const txRef = db.collection('transactions').doc(item.realId);
                const txDoc = await txRef.get();
                if(txDoc.exists) {
                    const txData = txDoc.data();
                    const newSplits = txData.splitParticipants.map(p => (p.email === currentUser.email || p.id === currentUser.email) ? { ...p, status: 'accepted' } : p);
                    await txRef.update({ splitParticipants: newSplits });

                    await db.collection('transactions').add({
                        creatorId: currentUser.uid, creatorEmail: currentUser.email, description: txData.description + ' (Acerto)',
                        amount: item.userAmount, type: 'expense', category: 'Outros', status: 'pending',
                        accountId: accounts[0]?.id || '', spaceId: spaces[0]?.id || '', dueDate: item.date, launchDate: item.date,
                        splitType: 'individual', inboxRef: item.realId, participantEmails: [currentUser.email]
                    });
                }
                setIsChatModalOpen(false);
                setActiveChatItem(null);
                showAlert('Sucesso', 'Despesa aceita e adicionada aos seus lançamentos. O Chat permanecerá ativo até o pagamento.');
            };

            const handleRejectInbox = (item) => {
                if(!item) return;
                showConfirm('Recusar Despesa', 'Tem certeza que deseja recusar este acerto?', async () => {
                    const txRef = db.collection('transactions').doc(item.realId);
                    const txDoc = await txRef.get();
                    if (txDoc.exists) {
                        const newSplits = txDoc.data().splitParticipants.map(p => (p.email === currentUser.email || p.id === currentUser.email) ? { ...p, status: 'rejected' } : p);
                        await txRef.update({ splitParticipants: newSplits });
                    }
                    closeConfirm();
                    setIsChatModalOpen(false);
                    setActiveChatItem(null);
                }, true);
            };
            
            const handleAcceptSpaceInvite = async (item) => {
                const spaceRef = db.collection('spaces').doc(item.realId);
                const spaceDoc = await spaceRef.get();
                if(spaceDoc.exists) {
                    const newMembersData = spaceDoc.data().membersData.map(m => m.email === currentUser.email ? { ...m, status: 'accepted' } : m);
                    await spaceRef.update({ membersData: newMembersData });
                    showAlert('Espaço Adicionado', `Você agora participa do espaço "${item.spaceName}".`);
                }
            };

            const handleRejectSpaceInvite = (item) => {
                showConfirm('Recusar Convite', `Deseja recusar o convite para "${item.spaceName}"?`, async () => {
                    const spaceRef = db.collection('spaces').doc(item.realId);
                    const spaceDoc = await spaceRef.get();
                    if(spaceDoc.exists) {
                         const sd = spaceDoc.data();
                         await spaceRef.update({ 
                             membersData: sd.membersData.filter(m => m.email !== currentUser.email),
                             participantEmails: sd.participantEmails.filter(e => e !== currentUser.email) 
                         });
                    }
                    closeConfirm();
                }, true);
            };

            const handleSendChatMessage = async (itemId, text) => {
                if(!text.trim() || !activeChatItem) return;
                const realId = activeChatItem.realId;
                const txRef = db.collection('transactions').doc(realId);
                const txDoc = await txRef.get();
                if (txDoc.exists) {
                    const messages = txDoc.data().messages || [];
                    messages.push({
                        id: Math.random().toString(), sender: userProfile?.name || currentUser.email,
                        senderEmail: currentUser.email, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    });
                    await txRef.update({ messages });
                }
            };

                            <div className="p-5 bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl shadow-sm">
                                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Despesas do Mês</p>
                                <p className="text-2xl font-bold text-rose-500 mb-2">R$ {totalExpense.toFixed(2)}</p>

                                                <div className="flex flex-col items-end gap-2">
                                                    <div className="flex space-x-2">
                                                        <button onClick={() => handleRejectSpaceInvite(item)} className="px-4 py-1.5 bg-rose-500/20 text-rose-400 rounded-lg text-xs font-bold hover:bg-rose-500/30">Recusar</button>
                                                        <button onClick={() => handleAcceptSpaceInvite(item)} className="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-500">Aceitar Convite</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col items-end gap-2">
                                                    <div className="text-right">
                                                        <p className="text-xs text-slate-400">Sua Parte</p><span className="text-xl font-bold text-rose-400">R$ {item.userAmount?.toFixed(2)}</span>
                                                    </div>
                                                    <div className="flex space-x-2">
                                                        <button onClick={() => { setActiveChatItem(item); setIsChatModalOpen(true); }} className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-500 transition-colors flex items-center">
                                                            <i className="ph-fill ph-chat-circle-dots mr-1"></i> Detalhes / Chat
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // --- MODAIS ---

            function ChatModal() {
                if (!activeChatItem || activeChatItem.type === 'space_invite') return null;
                const [msgText, setMsgText] = useState('');
                
                // Mágica para chat em tempo real ouvindo da transação do banco!
                const latestTx = transactions.find(t => t.id === activeChatItem.realId);
                const messages = latestTx?.messages || activeChatItem.messages || [];
                const isResolved = (latestTx?.status || activeChatItem.status) !== 'pending';

                return (
                    <div className="fixed inset-0 bg-black/80 z-50 flex justify-center items-center p-4">
                        <div className="bg-darkcard w-full max-w-md rounded-3xl shadow-2xl border border-darkborder overflow-hidden flex flex-col h-[80vh] animate-fade-in">
                            <div className="p-4 bg-slate-800 border-b border-darkborder flex justify-between items-center shrink-0">
                                <div><h3 className="font-bold text-white text-lg">{activeChatItem.description}</h3><p className="text-xs text-slate-400">De: {activeChatItem.from}</p></div>
                                <button type="button" onClick={() => setIsChatModalOpen(false)} className="text-slate-400 hover:text-white bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center"><i className="ph ph-x text-lg"></i></button>
                            </div>
                            <div className="p-4 bg-slate-900 border-b border-darkborder flex justify-between shrink-0">
                                <div className="text-center flex-1 border-r border-slate-700"><p className="text-[10px] uppercase text-slate-500 font-bold">Valor Total</p><p className="text-lg font-bold text-slate-300">R$ {activeChatItem.totalAmount?.toFixed(2)}</p></div>
                                <div className="text-center flex-1"><p className="text-[10px] uppercase text-slate-500 font-bold">Sua Parte</p><p className="text-lg font-bold text-rose-400">R$ {activeChatItem.userAmount?.toFixed(2)}</p></div>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-900">
                                {messages.map(m => (
                                    <div key={m.id} className={`flex flex-col ${m.senderEmail === currentUser.email ? 'items-end' : 'items-start'}`}>
                                        <span className="text-[10px] text-slate-500 mb-1">{m.senderEmail === currentUser.email ? 'Você' : m.sender} - {m.time}</span>
                                        <div className={`p-3 text-sm max-w-[85%] ${m.senderEmail === currentUser.email ? 'bg-indigo-600 text-white chat-bubble-right' : 'bg-slate-800 text-slate-200 border border-slate-700 chat-bubble-left'}`}>{m.text}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 bg-slate-800 border-t border-darkborder shrink-0">
                                {isResolved ? (
                                    <div className="text-center p-3 bg-slate-900 rounded-xl border border-slate-700"><i className="ph-fill ph-lock-key text-slate-500 text-2xl mb-1"></i><p className="text-xs font-bold text-slate-400">Este acerto já foi finalizado. Chat encerrado.</p></div>
                                ) : (
                                    <>
                                        <div className="flex gap-2 mb-4">
                                            <input type="text" value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyDown={(e)=>{if(e.key==='Enter') { handleSendChatMessage(activeChatItem.id, msgText); setMsgText(''); }}} placeholder="Escreva uma mensagem..." className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                            <button onClick={()=>{handleSendChatMessage(activeChatItem.id, msgText); setMsgText('');}} className="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center hover:bg-indigo-500 shrink-0"><i className="ph-fill ph-paper-plane-right"></i></button>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={()=>handleRejectInbox(activeChatItem)} className="flex-1 py-2 bg-rose-500/20 text-rose-400 border border-rose-500/50 rounded-xl text-sm font-bold hover:bg-rose-500/30">Recusar</button>
                                            <button onClick={()=>handleAcceptInbox(activeChatItem)} className="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold hover:bg-emerald-500">Aceitar Despesa</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            function TransactionModal() {
                const [txType, setTxType] = useState(editingTx?.type || 'expense');
                const [description, setDescription] = useState(editingTx?.description || '');
                const [amount, setAmount] = useState(editingTx?.amount || '');
                const [category, setCategory] = useState(editingTx?.category || categories[0]?.name || '');
                const [accountId, setAccountId] = useState(editingTx?.accountId || accounts[0]?.id || '');
                
                const today = new Date().toISOString().split('T')[0];
                const [launchDate, setLaunchDate] = useState(editingTx?.launchDate || today);
                const [dueDate, setDueDate] = useState(editingTx?.dueDate || today);
                const [isPaid, setIsPaid] = useState(editingTx?.status === 'paid' || false);
                const [effectiveDate, setEffectiveDate] = useState(editingTx?.effectiveDate || today);
                
                const [recurrence, setRecurrence] = useState(editingTx?.recurrence || 'none');
                const [installmentsTotal, setInstallmentsTotal] = useState(editingTx?.installmentsTotal || '');
                const [currentInstallment, setCurrentInstallment] = useState(editingTx?.currentInstallment || '');

                const [splitType, setSplitType] = useState(editingTx?.splitType || 'individual'); 
                const [spaceId, setSpaceId] = useState(editingTx?.spaceId || spaces[0]?.id || '');
                const [avulsoList, setAvulsoList] = useState(editingTx?.avulsoList || []);
                const [splitParticipants, setSplitParticipants] = useState(editingTx?.splitParticipants || []);

                const isCreditCard = accounts.find(a => a.id === accountId)?.type === 'credit';

                useEffect(() => {
                    if (editingTx && editingTx.splitParticipants && editingTx.splitParticipants.length > 0) return;
                    let pList = [{ id: 'me', name: 'Sua Parte (Você)', email: currentUser.email, amount: 0 }];

                    if (splitType === 'space') {
                        const space = spaces.find(s => s.id === spaceId);
                        if (space && space.participantEmails) {
                            space.participantEmails.forEach(email => {
                                if (email !== currentUser.email) pList.push({ id: email, email: email, name: email, amount: 0 });
                            });
                        }
                    } else if (splitType === 'avulso') {
                        avulsoList.forEach(av => {
                            if (av.email) pList.push({ id: av.id, email: av.email, name: av.email, amount: 0 });
                        });
                    }

                    const total = parseFloat(amount) || 0;
                    const each = total / pList.length;
                    pList = pList.map(p => ({ ...p, amount: each }));

                    setSplitParticipants(pList);
                }, [splitType, spaceId, avulsoList.length, amount]);

                const handleParticipantAmountChange = (id, newAmountStr) => {
                    let newAmount = parseFloat(newAmountStr);
                    if (isNaN(newAmount)) newAmount = 0;
                    const total = parseFloat(amount) || 0;
                    let updated = [...splitParticipants];
                    const targetIdx = updated.findIndex(p => p.id === id);
                    if (targetIdx === -1) return;

                    updated[targetIdx] = { ...updated[targetIdx], amount: newAmount };

                    if (id !== 'me') {
                        const othersSum = updated.filter(p => p.id !== 'me').reduce((acc, p) => acc + p.amount, 0);
                        const meIdx = updated.findIndex(p => p.id === 'me');
                        if (meIdx !== -1) updated[meIdx].amount = Math.max(0, total - othersSum);
                    } else {
                        const remaining = Math.max(0, total - newAmount);
                        const others = updated.filter(p => p.id !== 'me');
                        if (others.length > 0) {
                            const each = remaining / others.length;
                            updated = updated.map(p => p.id !== 'me' ? { ...p, amount: each } : p);
                        }
                    }
                    setSplitParticipants(updated);
                };

                const handleAddAvulso = () => setAvulsoList([...avulsoList, { id: Math.random().toString(36).substr(2), email: '' }]);
                const handleRemoveAvulso = (id) => setAvulsoList(avulsoList.filter(a => a.id !== id));
                const handleAvulsoChange = (id, field, value) => setAvulsoList(avulsoList.map(a => a.id === id ? { ...a, [field]: value } : a));

                const handleSubmit = (e) => {
                    e.preventDefault();
                    saveTransaction({ 
                        id: editingTx?.id, description, amount, type: txType, category, accountId, 
                        launchDate, dueDate: isCreditCard ? launchDate : dueDate, 
                        effectiveDate: isPaid && !isCreditCard ? effectiveDate : null, 
                        status: (isPaid && !isCreditCard) ? 'paid' : 'pending',
                        recurrence, installmentsTotal, currentInstallment, splitType, spaceId, avulsoList, splitParticipants
                    });
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-[105] flex justify-center items-center p-4">
                        <div className="bg-darkcard w-full max-w-2xl rounded-3xl shadow-2xl border border-darkborder overflow-hidden flex flex-col max-h-[95vh] animate-fade-in">
                            <div className="p-6 border-b border-darkborder flex justify-between items-center bg-slate-800/50 shrink-0">
                                <h2 className="text-xl font-bold text-white">{editingTx ? 'Editar Lançamento' : 'Novo Lançamento'}</h2>
                                <button type="button" onClick={() => setIsTransactionModalOpen(false)} className="text-slate-400 hover:text-rose-500"><i className="ph ph-x text-2xl"></i></button>
                            </div>
                            
                            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto modal-content space-y-6 flex-1">
                                <div className="flex bg-slate-900 p-1 rounded-xl">
                                    <button type="button" onClick={()=>setTxType('expense')} className={`flex-1 py-2 text-sm font-bold rounded-lg ${txType==='expense'?'bg-slate-700 text-rose-500 shadow':'text-slate-500 hover:bg-slate-800'}`}>Despesa</button>
                                    <button type="button" onClick={()=>setTxType('income')} className={`flex-1 py-2 text-sm font-bold rounded-lg ${txType==='income'?'bg-slate-700 text-emerald-500 shadow':'text-slate-500 hover:bg-slate-800'}`}>Receita</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="md:col-span-2"><label className="block text-xs font-bold text-slate-400 mb-1">Descrição</label><input required value={description} onChange={e=>setDescription(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Ex: Supermercado" /></div>
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">Valor Total (R$)</label><input type="number" step="0.01" required value={amount} onChange={e=>setAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xl font-bold text-white focus:outline-none focus:border-indigo-500" placeholder="0,00" /></div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 mb-1">Conta ou Cartão</label>
                                        <select value={accountId} onChange={e=>setAccountId(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                                            {accounts.map(a=><option key={a.id} value={a.id}>{a.name} ({a.type === 'credit' ? 'Cartão' : 'Conta'})</option>)}
                                        </select>
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-bold text-slate-400 mb-1">Categoria</label>
                                        <select value={category} onChange={e=>setCategory(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                                            {categories.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">Data da Compra / Lançamento</label><input type="date" required value={launchDate} onChange={e=>setLaunchDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none" /></div>
                                    {!isCreditCard && <div><label className="block text-xs font-bold text-slate-400 mb-1">Vencimento (Boleto)</label><input type="date" required value={dueDate} onChange={e=>setDueDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none" /></div>}
                                    {isCreditCard && <div className="flex items-center text-sm font-bold text-purple-400 bg-purple-900/20 p-2 rounded-lg border border-purple-500/30"><i className="ph-fill ph-info mr-2"></i> Lançamento vai para a fatura.</div>}
                                    
                                    {!isCreditCard && (
                                        <div className="md:col-span-2 flex flex-col sm:flex-row sm:items-center justify-between gap-3 mt-2 border-t border-slate-700 pt-3">
                                            <label className="flex items-center cursor-pointer"><input type="checkbox" checked={isPaid} onChange={e=>setIsPaid(e.target.checked)} className="w-5 h-5 rounded border-slate-600 bg-slate-900 text-indigo-500" /><span className="ml-2 font-bold text-sm text-slate-300">Marcar como Efetivado</span></label>
                                            {isPaid && <div className="flex items-center animate-fade-in"><label className="text-xs text-slate-400 mr-2 whitespace-nowrap">Data Efetivação:</label><input type="date" required value={effectiveDate} onChange={e=>setEffectiveDate(e.target.value)} className="w-36 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white text-xs" /></div>}
                                        </div>
                                    )}
                                </div>

                                <div className="border-t border-slate-700 pt-4">
                                    <label className="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Divisão / Rateio</label>
                                    <div className="flex gap-2 mb-4">
                                        <button type="button" onClick={()=>setSplitType('individual')} className={`flex-1 py-2 text-xs font-bold rounded-lg border ${splitType==='individual'?'bg-indigo-600 border-indigo-500 text-white':'bg-slate-800 border-slate-700 text-slate-400'}`}>Individual</button>
                                        <button type="button" onClick={()=>setSplitType('space')} className={`flex-1 py-2 text-xs font-bold rounded-lg border ${splitType==='space'?'bg-indigo-600 border-indigo-500 text-white':'bg-slate-800 border-slate-700 text-slate-400'}`}>Em Espaço</button>
                                        <button type="button" onClick={()=>setSplitType('avulso')} className={`flex-1 py-2 text-xs font-bold rounded-lg border ${splitType==='avulso'?'bg-indigo-600 border-indigo-500 text-white':'bg-slate-800 border-slate-700 text-slate-400'}`}>Avulso</button>
                                    </div>
                                    
                                    {splitType === 'space' && (
                                        <div className="animate-fade-in bg-slate-800/30 p-3 rounded-xl border border-slate-700/50">
                                            <label className="block text-xs font-bold text-slate-400 mb-1">Selecionar Espaço</label>
                                            <select value={spaceId} onChange={e=>setSpaceId(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none">
                                                {spaces.filter(s => !s.isIndividual).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                                            </select>
                                        </div>
                                    )}

                                    {splitType === 'avulso' && (
                                        <div className="space-y-3 animate-fade-in bg-slate-800/30 p-3 rounded-xl border border-slate-700/50">
                                            {avulsoList.map(av => (
                                                <div key={av.id} className="flex gap-2 items-center">
                                                    <input type="email" placeholder="E-mail do participante" value={av.email} onChange={e=>handleAvulsoChange(av.id, 'email', e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm" />
                                                    <button type="button" onClick={()=>handleRemoveAvulso(av.id)} className="p-2 text-rose-500 hover:bg-rose-500/20 rounded-lg"><i className="ph ph-trash"></i></button>
                                                </div>
                                            ))}
                                            <button type="button" onClick={handleAddAvulso} className="text-xs font-bold text-indigo-400 hover:text-indigo-300 flex items-center mt-2 px-2 py-1 rounded hover:bg-slate-800"><i className="ph ph-plus mr-1"></i> Adicionar pessoa avulsa</button>
                                        </div>
                                    )}

                                    {(splitType === 'space' || splitType === 'avulso') && splitParticipants.length > 1 && (
                                        <div className="mt-4 space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 animate-fade-in">
                                            <p className="text-[10px] uppercase text-slate-500 font-bold tracking-wider mb-2">Divisão Exata (R$)</p>
                                            {splitParticipants.map(p => (
                                                <div key={p.id} className="flex items-center justify-between gap-3">
                                                    <span className="text-sm font-medium text-slate-300 truncate flex-1">{p.name}</span>
                                                    <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 w-32 focus-within:border-indigo-500 transition-colors">
                                                        <span className="text-slate-500 text-xs font-bold mr-1">R$</span>
                                                        <input type="number" step="0.01" value={p.amount ? Number(p.amount).toString() : '0'} onChange={e => handleParticipantAmountChange(p.id, e.target.value)} className="w-full bg-transparent p-0 text-white text-sm focus:outline-none text-right font-bold" />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="pt-4 shrink-0"><button type="submit" className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-500 shadow-lg shadow-indigo-500/30 text-lg transition-colors">Salvar Lançamento</button></div>
                            </form>
                        </div>
                    </div>
                );
            }

            function AccountDetailsModal() {
                if(!selectedAccountDetails) return null;
                const acc = selectedAccountDetails;
                const accTxs = filteredTransactions.filter(t => t.accountId === acc.id);
                const totalMonth = accTxs.reduce((sum, t) => sum + (t.type === 'income' ? parseFloat(t.amount) : -parseFloat(t.amount)), 0);
                
                return (
                    <div className="fixed inset-0 bg-slate-900 z-[105] flex flex-col md:flex-row animate-fade-in">
                        <div className="w-full md:w-1/3 bg-darkcard p-8 flex flex-col border-r border-darkborder overflow-y-auto">
                            <div>
                                <button onClick={() => setSelectedAccountDetails(null)} className="w-10 h-10 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:bg-slate-700 hover:text-white mb-8 transition-colors"><i className="ph ph-arrow-left text-xl"></i></button>
                                <div className="w-16 h-16 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-3xl mb-4"><i className={`ph-fill ${acc.type === 'credit' ? 'ph-credit-card' : 'ph-wallet'}`}></i></div>
                                <h2 className="text-3xl font-bold text-white mb-2">{acc.name}</h2>
                                <p className="text-slate-400">{acc.type === 'credit' ? 'Fatura Prevista' : 'Movimentação do Mês'}</p>
                                <p className={`text-4xl font-bold mt-2 ${acc.type === 'credit' ? 'text-purple-500' : (totalMonth >= 0 ? 'text-emerald-500' : 'text-rose-500')}`}>R$ {Math.abs(acc.type === 'credit' ? accTxs.reduce((s,t)=>s+parseFloat(t.amount||0),0) : totalMonth).toFixed(2)}</p>
                            </div>
                        </div>
                        <div className="w-full md:w-2/3 p-8 overflow-y-auto bg-slate-900 relative">
                            <h3 className="text-xl font-bold text-white mb-6">Timeline de Extrato</h3>
                            <div className="absolute top-8 right-8 text-slate-500 font-bold">{monthYearString}</div>
                            <div className="space-y-4">
                                {accTxs.length === 0 ? <p className="text-slate-500 italic">Sem movimentações neste mês.</p> : accTxs.map(tx => (
                                    <div key={tx.id} className="flex justify-between items-center p-4 bg-darkcard border border-darkborder rounded-xl hover:border-slate-600 transition-colors">
                                        <div className="flex items-center">
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center mr-4 ${tx.type === 'income' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}><i className={`ph-bold ${tx.type === 'income' ? 'ph-arrow-down-left' : 'ph-arrow-up-right'}`}></i></div>
                                            <div><p className="font-bold text-slate-200">{tx.description}</p><p className="text-xs text-slate-400">Data: {tx.launchDate?.split('-').reverse().join('/')}</p></div>
                                        </div>
                                        <span className={`font-bold ${tx.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>{tx.type === 'income' ? '+' : '-'} R$ {parseFloat(tx.amount || 0).toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            function AccountModal() {
                const [name, setName] = useState(editingAccount?.name || '');
                const [initialBalance, setInitialBalance] = useState(editingAccount?.initialBalance || '');
                const [limit, setLimit] = useState(editingAccount?.limit || '');
                const [closingDay, setClosingDay] = useState(editingAccount?.closingDay || '');
                const [dueDay, setDueDay] = useState(editingAccount?.dueDay || '');
                
                const handleSave = (e) => {
                    e.preventDefault();
                    if(accountModalType === 'wallet') saveAccount({ id: editingAccount?.id, name, type: accountModalType, initialBalance: initialBalance || 0 });
                    else saveAccount({ id: editingAccount?.id, name, type: accountModalType, limit: limit || 0, closingDay, dueDay });
                };
                
                return (
                    <div className="fixed inset-0 bg-black/80 z-[105] flex items-center justify-center p-4">
                        <form onSubmit={handleSave} className="bg-darkcard w-full max-w-sm rounded-2xl p-6 border border-darkborder animate-fade-in">
                            <h2 className="text-lg font-bold mb-4">{editingAccount ? 'Editar' : 'Nova'} {accountModalType === 'wallet' ? 'Conta Bancária' : 'Cartão de Crédito'}</h2>
                            <div className="space-y-4">
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">Nome</label><input required value={name} onChange={e=>setName(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
                                {accountModalType === 'wallet' ? (
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">Saldo Inicial (R$)</label><input type="number" step="0.01" value={initialBalance} onChange={e=>setInitialBalance(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
                                ) : (
                                    <>
                                        <div><label className="block text-xs font-bold text-slate-400 mb-1">Limite (R$)</label><input type="number" step="0.01" required value={limit} onChange={e=>setLimit(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div><label className="block text-xs font-bold text-slate-400 mb-1">Dia Fechamento</label><input type="number" min="1" max="31" required value={closingDay} onChange={e=>setClosingDay(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
                                            <div><label className="block text-xs font-bold text-slate-400 mb-1">Dia Vencimento</label><input type="number" min="1" max="31" required value={dueDay} onChange={e=>setDueDay(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
                                        </div>
                                    </>
                                )}
                            </div>
                            <div className="flex justify-end space-x-3 mt-6">
                                <button type="button" onClick={()=>setIsAccountModalOpen(false)} className="px-4 py-2 text-slate-400 font-bold hover:bg-slate-800 rounded-lg">Cancelar</button>
                                <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg">Salvar</button>
                            </div>
                        </form>
                    </div>
                );
            }

            function SpaceModal() {
                const [name, setName] = useState(editingSpace?.name || '');
                const [color, setColor] = useState(editingSpace?.color || '#3b82f6');
                const [icon, setIcon] = useState(editingSpace?.icon || '📁');
                const [isIndividual, setIsIndividual] = useState(editingSpace ? editingSpace.isIndividual : false);
                const [members, setMembers] = useState(editingSpace?.membersData?.filter(m => m.email !== currentUser.email).map(m => m.email) || []);

                const isReadOnly = editingSpace && editingSpace.isCreator === false;

                const handleSave = (e) => {
                    e.preventDefault();
                    if (isReadOnly) { setIsSpaceModalOpen(false); return; }
                    saveSpace({ id: editingSpace?.id, name, color, icon, isIndividual, members: isIndividual ? [] : members.map(m=>m.trim()).filter(Boolean) });
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-[105] flex items-center justify-center p-4">
                        <form onSubmit={handleSave} className="bg-darkcard w-full max-w-md rounded-2xl p-6 border border-darkborder animate-fade-in max-h-[90vh] overflow-y-auto">
                            <h2 className="text-lg font-bold mb-4">{isReadOnly ? 'Detalhes do Espaço' : (editingSpace ? 'Editar Espaço' : 'Novo Espaço')}</h2>
                            <div className="space-y-4">
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">Nome do Espaço</label><input required value={name} onChange={e=>setName(e.target.value)} disabled={isReadOnly} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white disabled:opacity-50 disabled:cursor-not-allowed" /></div>
                                <label className={`flex items-center ${isReadOnly ? 'cursor-not-allowed opacity-70' : 'cursor-pointer'} bg-slate-800/50 p-2 rounded-lg`}>
                                    <input type="checkbox" checked={isIndividual} onChange={e=>setIsIndividual(e.target.checked)} disabled={isReadOnly} className="w-4 h-4 rounded border-slate-600 bg-slate-900 text-indigo-500 mr-2 disabled:cursor-not-allowed" /><span className="text-sm font-bold text-slate-300">Espaço Individual (Privado)</span>
                                </label>
                                {!isIndividual && (
                                    <div className="animate-fade-in space-y-3 bg-slate-800/30 p-3 rounded-xl border border-slate-700/50">
                                        <label className="block text-xs font-bold text-slate-400 mb-1">Membros (E-mails)</label>
                                        {members.map((m, i) => (
                                            <div key={i} className="flex gap-2 items-center">
                                                <input type="email" placeholder="email@exemplo.com" value={m} onChange={e=>{const n=[...members]; n[i]=e.target.value; setMembers(n);}} disabled={isReadOnly} className="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm disabled:opacity-50 disabled:cursor-not-allowed" />
                                                {!isReadOnly && <button type="button" onClick={()=>setMembers(members.filter((_, idx)=>idx!==i))} className="p-2 text-rose-500 hover:bg-rose-500/20 rounded-lg"><i className="ph ph-trash"></i></button>}
                                            </div>
                                        ))}
                                        {!isReadOnly && <button type="button" onClick={()=>setMembers([...members,''])} className="text-xs font-bold text-indigo-400 hover:text-indigo-300 flex items-center mt-2 px-2 py-1 rounded hover:bg-slate-800"><i className="ph ph-plus mr-1"></i> Adicionar membro</button>}
                                    </div>
                                )}
                                <div className="flex space-x-4">
                                    <div className="flex-1"><label className="block text-xs font-bold text-slate-400 mb-1">Cor</label><input type="color" value={color} onChange={e=>setColor(e.target.value)} disabled={isReadOnly} className="w-full h-10 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" /></div>
                                    <div className="flex-1"><label className="block text-xs font-bold text-slate-400 mb-1">Ícone</label><input value={icon} onChange={e=>setIcon(e.target.value)} disabled={isReadOnly} className="w-full h-10 bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-xl disabled:opacity-50 disabled:cursor-not-allowed" maxLength="2" /></div>
                                </div>
                            </div>
                            <div className="flex justify-end space-x-3 mt-6">
                                {isReadOnly ? (
                                    <button type="button" onClick={()=>setIsSpaceModalOpen(false)} className="px-4 py-2 bg-slate-700 text-white font-bold hover:bg-slate-600 rounded-lg">Fechar Detalhes</button>
                                ) : (
                                    <>
                                        <button type="button" onClick={()=>setIsSpaceModalOpen(false)} className="px-4 py-2 text-slate-400 font-bold hover:bg-slate-800 rounded-lg">Cancelar</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg">Salvar</button>
                                    </>
                                )}
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className={`${isDarkMode ? 'dark' : ''} flex h-screen bg-darkbg text-slate-200 overflow-hidden`}>
                    
                    {/* Mobile Menu Backdrop */}
                    {isMobileMenuOpen && (
                        <div className="md:hidden fixed inset-0 bg-black/60 z-[90] animate-fade-in" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}

                    {/* Sidebar */}
                    <aside onMouseEnter={() => setIsSidebarHovered(true)} onMouseLeave={() => setIsSidebarHovered(false)} 
                           className={`${isSidebarExpanded ? 'w-64' : 'w-20'} flex-shrink-0 bg-darkcard border-r border-darkborder flex flex-col z-[100] transition-all duration-300 fixed md:relative inset-y-0 left-0 transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-5 flex items-center border-b border-darkborder overflow-hidden h-20">
                            <div className="w-10 h-10 min-w-[40px] rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-lg"><i className="ph-fill ph-wallet"></i></div>
                            <span className={`font-bold text-xl tracking-tight text-white ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0'}`}>Finanças</span>
                        </div>
                        {isSidebarExpanded && <button onClick={() => setIsSidebarPinned(!isSidebarPinned)} className="absolute top-7 right-4 text-slate-400 hover:text-white transition-colors hidden md:block"><i className={`ph ${isSidebarPinned ? 'ph-push-pin-slash' : 'ph-push-pin'} text-lg`}></i></button>}
                        <nav className="flex-1 py-6 space-y-2 overflow-x-hidden px-3">
                            <button onClick={() => handleTabChange('dashboard')} className={`w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm ${activeTab === 'dashboard' ? 'bg-indigo-500/20 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="ph ph-squares-four text-xl min-w-[24px]"></i><span className={`ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0 md:hidden'}`}>Resumo Geral</span>
                            </button>
                            <button onClick={() => handleTabChange('transactions')} className={`w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm ${activeTab === 'transactions' ? 'bg-indigo-500/20 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="ph ph-list-dashes text-xl min-w-[24px]"></i><span className={`ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0 md:hidden'}`}>Lançamentos</span>
                            </button>
                            <button onClick={() => handleTabChange('accounts')} className={`w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm ${activeTab === 'accounts' ? 'bg-indigo-500/20 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="ph ph-bank text-xl min-w-[24px]"></i><span className={`ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0 md:hidden'}`}>Contas & Cartões</span>
                            </button>
                            <button onClick={() => handleTabChange('spaces')} className={`w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm ${activeTab === 'spaces' ? 'bg-indigo-500/20 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="ph ph-users text-xl min-w-[24px]"></i><span className={`ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0 md:hidden'}`}>Espaços & Rateios</span>
                            </button>
                            <button onClick={() => handleTabChange('inbox')} className={`w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm relative ${activeTab === 'inbox' ? 'bg-amber-500/20 text-amber-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="ph ph-bell-ringing text-xl min-w-[24px]"></i><span className={`ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0 md:hidden'}`}>Pendências / Chat</span>
                                {inboxItems.length > 0 && <span className="absolute right-3 top-1/2 -translate-y-1/2 bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">{inboxItems.length}</span>}
                            </button>
                        </nav>
                        <div className="p-3 border-t border-darkborder overflow-hidden">
                            <button onClick={() => auth.signOut()} className="w-full flex items-center p-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-rose-400 font-bold text-sm transition-colors">
                                <i className="ph ph-sign-out text-xl min-w-[24px]"></i><span className={`ml-3 whitespace-nowrap transition-opacity duration-300 ${isSidebarExpanded ? 'opacity-100' : 'opacity-0 md:hidden'}`}>Sair</span>
                            </button>
                        </div>
                    </aside>

                    {/* Central */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="h-20 flex-shrink-0 bg-darkcard border-b border-darkborder px-4 md:px-8 flex items-center justify-between z-10">
                            <h1 className="text-xl font-bold text-white flex items-center">
                                <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden mr-4 text-slate-400 hover:text-white"><i className="ph ph-list text-2xl"></i></button>
                                Meu Painel 👋
                            </h1>
                            <div className="flex items-center space-x-6">
                                <div className="flex items-center bg-slate-800 rounded-full p-1 border border-slate-700 shadow-inner">
                                    <button onClick={handlePrevMonth} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-700 hover:text-white transition-colors"><i className="ph ph-caret-left"></i></button>
                                    <span className="px-4 text-sm font-bold text-slate-200 min-w-[120px] text-center">{monthYearString}</span>
                                    <button onClick={handleNextMonth} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-700 hover:text-white transition-colors"><i className="ph ph-caret-right"></i></button>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 relative pb-24">
                            <div className="max-w-6xl mx-auto h-full">
                                {activeTab === 'dashboard' && <DashboardTab />}
                                {activeTab === 'transactions' && <TransactionsTab />}
                                {activeTab === 'accounts' && <AccountsTab />}
                                {activeTab === 'spaces' && <SpacesTab />}
                                {activeTab === 'inbox' && <InboxTab />}
                            </div>
                        </main>

                        <button onClick={() => { setEditingTx(null); setIsTransactionModalOpen(true); }} className="absolute bottom-8 right-8 w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-xl shadow-indigo-500/40 flex items-center justify-center hover:-translate-y-1 hover:bg-indigo-500 transition-all z-40">
                            <i className="ph ph-plus text-3xl"></i>
                        </button>
                    </div>

                    {/* Modais Globais */}
                    {isTransactionModalOpen && <TransactionModal />}
                    {isAccountModalOpen && <AccountModal />}
                    {isSpaceModalOpen && <SpaceModal />}
                    <AccountDetailsModal />
                    <ChatModal />
                    
                    {/* Alertas e Confirmações Globais */}
                    <DialogModal {...confirmDialog} onCancel={closeConfirm} />
                    <AlertModal {...alertDialog} onClose={closeAlert} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
