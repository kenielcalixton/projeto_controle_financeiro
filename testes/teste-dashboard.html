<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual - Dashboard Vanilla JS (Sidebar Inteligente)</title>
    <!-- Tailwind CSS e Ícones -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b', darkborder: '#334155' } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 transition-colors duration-200">
    
    <div id="app-root" class="w-full h-screen"></div>

    <script type="module">
        // ----------------------------------------------------------------
        // 1. Simulação do ficheiro /js/layout/appShell.js
        // ----------------------------------------------------------------
        function renderizarLayout() {
            const root = document.getElementById('app-root');
            
            root.innerHTML = `
                <div class="flex h-screen bg-slate-900 text-slate-200 overflow-hidden w-full relative">
                    
                    <!-- Fundo escuro para o Menu Mobile -->
                    <div id="mobile-backdrop" class="md:hidden fixed inset-0 bg-black/60 z-[90] hidden animate-fade-in"></div>

                    <!-- Menu Lateral (Sidebar) com Posição Fixa -->
                    <aside id="sidebar" class="fixed inset-y-0 left-0 z-[100] bg-slate-800 border-r border-slate-700 flex flex-col transition-all duration-300 transform -translate-x-full md:translate-x-0 w-64 md:w-20 overflow-hidden group">
                        
                        <div class="p-5 flex items-center border-b border-slate-700 h-20 shrink-0 relative">
                            <div class="w-10 h-10 min-w-[40px] rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-lg">
                                <i class="ph-fill ph-wallet"></i>
                            </div>
                            <span class="sidebar-text font-bold text-xl tracking-tight text-white ml-3 whitespace-nowrap transition-opacity duration-300 md:opacity-0">Finanças</span>
                            
                            <!-- Botão Fixar (Aparece apenas no Desktop ao Expandir) -->
                            <button id="btn-pin" class="hidden md:block absolute right-4 top-7 text-slate-400 hover:text-white transition-all duration-300 opacity-0 pointer-events-none">
                                <i class="ph ph-push-pin text-lg"></i>
                            </button>
                        </div>
                        
                        <nav class="flex-1 py-6 space-y-2 px-3 overflow-x-hidden">
                            <button class="w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm bg-indigo-500/20 text-indigo-400 overflow-hidden">
                                <i class="ph ph-squares-four text-xl min-w-[24px]"></i>
                                <span class="sidebar-text ml-3 whitespace-nowrap transition-opacity duration-300 md:opacity-0">Resumo Geral</span>
                            </button>
                            <button class="w-full flex items-center p-3 rounded-xl transition-all font-bold text-sm text-slate-400 hover:bg-slate-700 overflow-hidden">
                                <i class="ph ph-list-dashes text-xl min-w-[24px]"></i>
                                <span class="sidebar-text ml-3 whitespace-nowrap transition-opacity duration-300 md:opacity-0">Lançamentos</span>
                            </button>
                        </nav>
                        
                        <div class="p-3 border-t border-slate-700 shrink-0">
                            <button class="w-full flex items-center p-3 rounded-xl text-slate-400 hover:bg-slate-700 hover:text-rose-400 font-bold text-sm transition-colors overflow-hidden">
                                <i class="ph ph-sign-out text-xl min-w-[24px]"></i>
                                <span class="sidebar-text ml-3 whitespace-nowrap transition-opacity duration-300 md:opacity-0">Sair</span>
                            </button>
                        </div>
                    </aside>

                    <!-- Área Central: Afasta-se da borda com base no estado do Menu -->
                    <div id="main-wrapper" class="flex-1 flex flex-col h-screen overflow-hidden relative transition-all duration-300 ml-0 md:ml-20">
                        
                        <!-- Cabeçalho (Header) -->
                        <header class="h-20 flex-shrink-0 bg-slate-800 border-b border-slate-700 px-4 md:px-8 flex items-center justify-between z-10">
                            <h1 class="text-xl font-bold text-white flex items-center">
                                <button id="btn-mobile-menu" class="md:hidden mr-4 text-slate-400 hover:text-white">
                                    <i class="ph ph-list text-2xl"></i>
                                </button>
                                Meu Painel 👋
                            </h1>
                            
                            <div class="flex items-center bg-slate-900 rounded-full p-1 border border-slate-700 shadow-inner">
                                <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-700 hover:text-white transition-colors"><i class="ph ph-caret-left"></i></button>
                                <span class="px-4 text-sm font-bold text-slate-200 min-w-[120px] text-center">NOVEMBRO 2026</span>
                                <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-700 hover:text-white transition-colors"><i class="ph ph-caret-right"></i></button>
                            </div>
                        </header>

                        <!-- Área de Conteúdo Dinâmico -->
                        <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 relative pb-24">
                            <!-- O Dashboard entra aqui -->
                        </main>

                        <button class="absolute bottom-8 right-8 w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-xl shadow-indigo-500/40 flex items-center justify-center hover:-translate-y-1 hover:bg-indigo-500 transition-all z-40">
                            <i class="ph ph-plus text-3xl"></i>
                        </button>
                    </div>
                </div>
            `;

            // --- Lógica de Estado do Layout ---
            let isPinned = false;
            let isHovered = false;
            let isMobileOpen = false;

            const sidebar = document.getElementById('sidebar');
            const mainWrapper = document.getElementById('main-wrapper');
            const backdrop = document.getElementById('mobile-backdrop');
            const texts = document.querySelectorAll('.sidebar-text');
            const btnPin = document.getElementById('btn-pin');
            const btnMobile = document.getElementById('btn-mobile-menu');

            // Função centralizada que redesenha as classes com base no estado atual
            function updateUI() {
                // 1. Lógica do Mobile
                if (isMobileOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    backdrop.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    backdrop.classList.add('hidden');
                }

                // 2. Lógica da Largura da Sidebar e Textos (Desktop)
                if (isPinned || isHovered) {
                    sidebar.classList.remove('md:w-20');
                    sidebar.classList.add('md:w-64');
                    // Mostra textos e ícone de fixar
                    texts.forEach(t => { t.classList.remove('md:opacity-0'); t.classList.add('md:opacity-100'); });
                    btnPin.classList.remove('opacity-0', 'pointer-events-none');
                } else {
                    sidebar.classList.add('md:w-20');
                    sidebar.classList.remove('md:w-64');
                    // Esconde textos e ícone de fixar
                    texts.forEach(t => { t.classList.remove('md:opacity-100'); t.classList.add('md:opacity-0'); });
                    btnPin.classList.add('opacity-0', 'pointer-events-none');
                }

                // 3. Lógica do Deslocamento do Conteúdo Central (Desktop)
                if (isPinned) {
                    mainWrapper.classList.remove('md:ml-20');
                    mainWrapper.classList.add('md:ml-64');
                    btnPin.innerHTML = '<i class="ph ph-push-pin-slash text-lg"></i>';
                    btnPin.classList.add('text-indigo-400'); // Destaca o ícone quando fixo
                } else {
                    mainWrapper.classList.add('md:ml-20');
                    mainWrapper.classList.remove('md:ml-64');
                    btnPin.innerHTML = '<i class="ph ph-push-pin text-lg"></i>';
                    btnPin.classList.remove('text-indigo-400');
                }
            }

            // Eventos de Mouse (Hover Flutuante)
            sidebar.addEventListener('mouseenter', () => {
                if (window.innerWidth >= 768) { isHovered = true; updateUI(); }
            });

            sidebar.addEventListener('mouseleave', () => {
                if (window.innerWidth >= 768) { isHovered = false; updateUI(); }
            });

            // Evento de Fixar
            btnPin.addEventListener('click', () => {
                isPinned = !isPinned;
                updateUI();
            });

            // Eventos Mobile
            btnMobile.addEventListener('click', () => { isMobileOpen = true; updateUI(); });
            backdrop.addEventListener('click', () => { isMobileOpen = false; updateUI(); });

            // Inicia o UI e renderiza o miolo
            updateUI();
            renderizarDashboard();
        }

        // ----------------------------------------------------------------
        // 2. Simulação do ficheiro /js/components/dashboard.js
        // ----------------------------------------------------------------
        function renderizarDashboard() {
            const main = document.getElementById('main-content');
            
            main.innerHTML = `
                <div class="space-y-6 animate-fade-in max-w-6xl mx-auto h-full">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                        
                        <div class="p-5 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm flex flex-col justify-between">
                            <div><p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Saldo Inicial (Contas)</p></div>
                            <p class="text-3xl font-bold tracking-tight text-indigo-500">R$ 1.500,00</p>
                        </div>
                        
                        <div class="p-5 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm">
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Receitas do Mês</p>
                            <p class="text-2xl font-bold text-emerald-500 mb-2">R$ 5.000,00</p>
                            <div class="flex justify-between text-xs text-slate-500">
                                <span>Efetivado: <span class="font-bold text-emerald-400">R$ 4.000,00</span></span>
                            </div>
                        </div>
                        
                        <div class="p-5 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm">
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Despesas do Mês</p>
                            <p class="text-2xl font-bold text-rose-500 mb-2">R$ 3.200,00</p>
                            <div class="flex justify-between text-xs text-slate-500">
                                <span>Efetivado: <span class="font-bold text-rose-400">R$ 2.000,00</span></span>
                            </div>
                        </div>
                        
                        <div class="p-5 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm bg-indigo-900/10">
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Saldo Final Mês</p>
                            <p class="text-2xl font-bold text-emerald-500 mb-2">R$ 3.300,00</p>
                            <div class="text-xs text-slate-500">Saldo Efetivado: <span class="font-bold text-emerald-400">R$ 3.500,00</span></div>
                        </div>

                    </div>
                </div>
            `;
        }

        renderizarLayout();
    </script>
</body>
</html>
