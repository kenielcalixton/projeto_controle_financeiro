<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual - Modal Avançado (Recorrência Melhorada)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b', darkborder: '#334155' } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .animate-fade-in { animation: fadeIn 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex items-center justify-center relative">

    <button id="btn-open-modal" class="absolute bottom-8 right-8 w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-xl flex items-center justify-center hover:-translate-y-1 transition-all z-0">
        <i class="ph ph-plus text-3xl"></i>
    </button>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-[105] flex justify-center items-center p-4 hidden animate-fade-in">
        
        <div class="bg-darkcard w-full max-w-2xl rounded-3xl shadow-2xl border border-darkborder flex flex-col max-h-[95vh]">
            
            <div class="p-6 border-b border-darkborder flex justify-between items-center bg-slate-800/50 shrink-0 rounded-t-3xl">
                <h2 class="text-xl font-bold text-white">Novo Lançamento</h2>
                <button id="btn-close-modal" class="text-slate-400 hover:text-rose-500 transition-colors"><i class="ph ph-x text-2xl"></i></button>
            </div>
            
            <form id="form-transaction" class="p-6 overflow-y-auto space-y-6 flex-1">
                
                <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                    <button type="button" id="btn-type-expense" class="flex-1 py-2 text-sm font-bold rounded-lg bg-slate-700 text-rose-500 shadow transition-all">Despesa</button>
                    <button type="button" id="btn-type-income" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:bg-slate-800 transition-all">Receita</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-12">
                        <label class="block text-xs font-bold text-slate-400 mb-1">Descrição</label>
                        <input type="text" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Ex: Compra do mês" />
                    </div>
                    
                    <div class="md:col-span-5">
                        <label class="block text-xs font-bold text-slate-400 mb-1">Valor Total (R$)</label>
                        <input type="number" id="input-amount" step="0.01" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xl font-bold text-white focus:outline-none focus:border-indigo-500" placeholder="0,00" />
                    </div>
                    
                    <!-- NOVO: Botões de Tipo de Registro (Segmented Control) -->
                    <div class="md:col-span-7">
                        <label class="block text-xs font-bold text-slate-400 mb-2">Tipo de Registro</label>
                        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700 h-[52px]">
                            <button type="button" id="btn-rec-none" class="flex-1 py-1 text-xs font-bold rounded-lg bg-slate-700 text-indigo-400 shadow transition-all">Único</button>
                            <button type="button" id="btn-rec-fixed" class="flex-1 py-1 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-800 transition-all">Fixo</button>
                            <button type="button" id="btn-rec-inst" class="flex-1 py-1 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-800 transition-all">Parcelado</button>
                        </div>
                    </div>

                    <div id="box-installments" class="hidden md:col-span-12 grid-cols-2 gap-4 animate-fade-in bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">Parcela Inicial</label>
                            <input type="number" id="current-inst" min="1" placeholder="Ex: 5" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">Total de Parcelas</label>
                            <input type="number" id="total-inst" min="2" placeholder="Ex: 10" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500" />
                        </div>
                    </div>
                </div>

                <div class="space-y-4 bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">Conta ou Cartão</label>
                        <select id="select-account" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                            <option value="wallet">🏦 Carteira (Conta Corrente)</option>
                            <option value="credit">💳 Nubank (Cartão de Crédito)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">Data do Registro/Compra</label>
                            <input type="date" id="input-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500" />
                        </div>
                        
                        <div id="box-due-date">
                            <label class="block text-xs font-bold text-slate-400 mb-1">Data de Vencimento</label>
                            <input type="date" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500" />
                        </div>
                        
                        <div id="box-credit-info" class="hidden flex items-center text-sm text-purple-300 bg-purple-900/30 p-3 rounded-lg border border-purple-500/30 h-full">
                            <i class="ph-fill ph-magic-wand text-2xl mr-3 text-purple-400"></i> 
                            <div>
                                <p class="font-bold text-purple-400">Lançamento em Cartão</p>
                                <p class="text-[10px] opacity-80 leading-tight">O mês da fatura será calculado automaticamente.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-700 pt-4">
                    <label class="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Divisão / Rateio Editável</label>
                    <div class="flex gap-2 mb-4">
                        <button type="button" id="btn-split-ind" class="split-btn flex-1 py-2 text-xs font-bold rounded-lg border bg-indigo-600 border-indigo-500 text-white">Individual</button>
                        <button type="button" id="btn-split-space" class="split-btn flex-1 py-2 text-xs font-bold rounded-lg border bg-slate-800 border-slate-700 text-slate-400">Em Espaço</button>
                        <button type="button" id="btn-split-avulso" class="split-btn flex-1 py-2 text-xs font-bold rounded-lg border bg-slate-800 border-slate-700 text-slate-400">Avulso</button>
                    </div>

                    <div id="box-space" class="hidden animate-fade-in bg-slate-800/30 p-3 rounded-xl border border-slate-700/50 text-sm text-slate-400">
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white" id="space-selector">
                            <option value="">Selecione um espaço...</option>
                            <option value="casa">🏠 Casa (Gabe e Keni)</option>
                        </select>
                    </div>

                    <div id="box-avulso" class="hidden space-y-3 animate-fade-in bg-slate-800/30 p-3 rounded-xl border border-slate-700/50">
                        <p class="text-xs text-slate-400"><i class="ph ph-envelope-simple mr-1"></i> Convite por e-mail para não cadastrados.</p>
                        <div id="avulso-list" class="space-y-2"></div>
                        <button type="button" id="btn-add-email" class="text-xs font-bold text-indigo-400 hover:text-indigo-300 flex items-center mt-2 px-2 py-1 rounded hover:bg-slate-800">
                            <i class="ph ph-plus mr-1"></i> Adicionar pessoa (E-mail)
                        </button>
                    </div>

                    <div id="box-math" class="hidden mt-4 space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 animate-fade-in">
                        <p class="text-[10px] uppercase text-slate-500 font-bold tracking-wider mb-2">Ajuste Fino de Valores (R$)</p>
                        <div id="math-list" class="space-y-2"></div>
                    </div>
                </div>

                <div class="pt-4 shrink-0">
                    <button type="submit" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-500 shadow-lg shadow-indigo-500/30 text-lg transition-colors">Salvar Lançamento</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        const btnOpen = document.getElementById('btn-open-modal');
        const btnClose = document.getElementById('btn-close-modal');
        const overlay = document.getElementById('modal-overlay');
        
        // Novos elementos UI de Recorrência
        const btnRecNone = document.getElementById('btn-rec-none');
        const btnRecFixed = document.getElementById('btn-rec-fixed');
        const btnRecInst = document.getElementById('btn-rec-inst');
        const boxInst = document.getElementById('box-installments');

        const selectAcc = document.getElementById('select-account');
        const boxDueDate = document.getElementById('box-due-date');
        const boxCredit = document.getElementById('box-credit-info');
        
        const inputAmount = document.getElementById('input-amount');
        const btnInd = document.getElementById('btn-split-ind');
        const btnSpace = document.getElementById('btn-split-space');
        const btnAvulso = document.getElementById('btn-split-avulso');
        const boxSpace = document.getElementById('box-space');
        const boxAvulso = document.getElementById('box-avulso');
        const boxMath = document.getElementById('box-math');
        const avulsoList = document.getElementById('avulso-list');
        const btnAddEmail = document.getElementById('btn-add-email');
        const mathList = document.getElementById('math-list');
        const spaceSelector = document.getElementById('space-selector');

        let participants = [{ id: 'me', name: 'Sua Parte', email: 'voce@email.com', amount: 0 }];
        let splitMode = 'individual';
        let recurrenceType = 'none';

        document.getElementById('input-date').valueAsDate = new Date();
        btnOpen.addEventListener('click', () => overlay.classList.remove('hidden'));
        btnClose.addEventListener('click', () => overlay.classList.add('hidden'));

        // ==========================================
        // NOVA LÓGICA DO TIPO DE REGISTRO
        // ==========================================
        function updateRecurrenceUI(type) {
            recurrenceType = type;
            
            // Reseta cores
            [btnRecNone, btnRecFixed, btnRecInst].forEach(b => {
                b.className = 'flex-1 py-1 text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-800 transition-all';
            });
            
            // Pinta o ativo
            const activeBtn = type === 'none' ? btnRecNone : (type === 'fixed' ? btnRecFixed : btnRecInst);
            activeBtn.className = 'flex-1 py-1 text-xs font-bold rounded-lg bg-slate-700 text-indigo-400 shadow transition-all';

            // Abre/Fecha caixa de parcelas
            if (type === 'installments') {
                boxInst.classList.remove('hidden');
                boxInst.classList.add('grid');
                document.getElementById('current-inst').required = true;
                document.getElementById('total-inst').required = true;
            } else {
                boxInst.classList.add('hidden');
                boxInst.classList.remove('grid');
                document.getElementById('current-inst').required = false;
                document.getElementById('total-inst').required = false;
            }
        }

        btnRecNone.addEventListener('click', () => updateRecurrenceUI('none'));
        btnRecFixed.addEventListener('click', () => updateRecurrenceUI('fixed'));
        btnRecInst.addEventListener('click', () => updateRecurrenceUI('installments'));


        selectAcc.addEventListener('change', (e) => {
            if (e.target.value === 'credit') {
                boxDueDate.classList.add('hidden');
                boxCredit.classList.remove('hidden');
            } else {
                boxDueDate.classList.remove('hidden');
                boxCredit.classList.add('hidden');
            }
        });

        const btnExp = document.getElementById('btn-type-expense');
        const btnInc = document.getElementById('btn-type-income');
        btnExp.addEventListener('click', () => {
            btnExp.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-slate-700 text-rose-500 shadow transition-all';
            btnInc.className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:bg-slate-800 transition-all';
        });
        btnInc.addEventListener('click', () => {
            btnInc.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-slate-700 text-emerald-500 shadow transition-all';
            btnExp.className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:bg-slate-800 transition-all';
        });
        
        function updateSplitUI(mode) {
            splitMode = mode;
            [btnInd, btnSpace, btnAvulso].forEach(b => b.className = 'split-btn flex-1 py-2 text-xs font-bold rounded-lg border bg-slate-800 border-slate-700 text-slate-400');
            document.getElementById(`btn-split-${mode === 'ind' ? 'ind' : mode}`).className = 'split-btn flex-1 py-2 text-xs font-bold rounded-lg border bg-indigo-600 border-indigo-500 text-white';

            boxSpace.classList.add('hidden');
            boxAvulso.classList.add('hidden');
            boxMath.classList.add('hidden');

            if (mode === 'ind') {
                participants = [{ id: 'me', name: 'Sua Parte', email: 'voce@email.com', amount: 0 }];
            } else if (mode === 'space') {
                boxSpace.classList.remove('hidden');
                spaceSelector.addEventListener('change', (e) => {
                    if(e.target.value === 'casa') {
                        boxMath.classList.remove('hidden');
                        participants = [
                            { id: 'me', name: 'Sua Parte (Keni)', email: 'keni@email.com', amount: 0 },
                            { id: 'gabe', name: 'Gabe', email: 'gabe@email.com', amount: 0 }
                        ];
                        calcularMatematicaBase();
                    }
                });
            } else if (mode === 'avulso') {
                boxAvulso.classList.remove('hidden');
                boxMath.classList.remove('hidden');
                participants = [{ id: 'me', name: 'Sua Parte', email: 'voce@email.com', amount: 0 }];
                renderAvulsoInputs();
            }
            calcularMatematicaBase();
        }

        btnInd.addEventListener('click', () => updateSplitUI('ind'));
        btnSpace.addEventListener('click', () => updateSplitUI('space'));
        btnAvulso.addEventListener('click', () => updateSplitUI('avulso'));

        btnAddEmail.addEventListener('click', () => {
            const id = Math.random().toString(36).substr(2, 5);
            participants.push({ id, name: 'Convidado', email: '', amount: 0 });
            renderAvulsoInputs();
            calcularMatematicaBase();
        });

        function removeEmail(id) {
            participants = participants.filter(p => p.id !== id);
            renderAvulsoInputs();
            calcularMatematicaBase();
        }

        function renderAvulsoInputs() {
            avulsoList.innerHTML = '';
            participants.filter(p => p.id !== 'me').forEach(p => {
                const div = document.createElement('div');
                div.className = "flex gap-2 items-center animate-fade-in";
                div.innerHTML = `
                    <input type="email" placeholder="email@exemplo.com" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm focus:border-indigo-500 outline-none" />
                    <button type="button" class="p-2 text-rose-500 hover:bg-rose-500/20 rounded-lg transition-colors"><i class="ph ph-trash"></i></button>
                `;
                div.querySelector('button').addEventListener('click', () => removeEmail(p.id));
                div.querySelector('input').addEventListener('input', (e) => {
                    p.email = e.target.value;
                    p.name = e.target.value;
                    renderMathInputs();
                });
                avulsoList.appendChild(div);
            });
        }

        inputAmount.addEventListener('input', calcularMatematicaBase);

        function calcularMatematicaBase() {
            const total = parseFloat(inputAmount.value) || 0;
            const numPart = participants.length;
            const each = total / numPart;
            participants.forEach(p => p.amount = each);
            renderMathInputs();
        }

        window.handleManualChange = function(id, newAmountStr) {
            let newAmount = parseFloat(newAmountStr);
            if (isNaN(newAmount)) newAmount = 0;
            const total = parseFloat(inputAmount.value) || 0;

            const target = participants.find(p => p.id === id);
            if (!target) return;
            
            target.amount = newAmount;

            if (id !== 'me') {
                const othersSum = participants.filter(p => p.id !== 'me').reduce((acc, p) => acc + p.amount, 0);
                const me = participants.find(p => p.id === 'me');
                if (me) me.amount = Math.max(0, total - othersSum);
            } else {
                const remaining = Math.max(0, total - newAmount);
                const others = participants.filter(p => p.id !== 'me');
                if (others.length > 0) {
                    const each = remaining / others.length;
                    others.forEach(p => p.amount = each);
                }
            }
            renderMathInputs();
        }

        function renderMathInputs() {
            if (splitMode === 'ind') { boxMath.classList.add('hidden'); return; }
            
            mathList.innerHTML = '';
            participants.forEach(p => {
                const isMe = p.id === 'me';
                const div = document.createElement('div');
                div.className = "flex items-center justify-between gap-3";
                div.innerHTML = `
                    <span class="text-sm font-medium ${isMe ? 'text-indigo-400 font-bold' : 'text-slate-300'} truncate flex-1">${p.name || p.email}</span>
                    <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 w-32 focus-within:border-indigo-500 transition-colors">
                        <span class="text-slate-500 text-xs font-bold mr-1">R$</span>
                        <input type="number" step="0.01" value="${p.amount.toFixed(2)}" onchange="handleManualChange('${p.id}', this.value)" class="w-full bg-transparent p-0 text-white text-sm focus:outline-none text-right font-bold" />
                    </div>
                `;
                mathList.appendChild(div);
            });
        }

        document.getElementById('form-transaction').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Formulário atualizado: O "Tipo de Registro" agora usa Segmented Controls!');
            overlay.classList.add('hidden');
        });
    </script>
</body>
</html>
